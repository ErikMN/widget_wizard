name: Web devbranch checks

on:
  push:
    branches:
      - devbranch

jobs:
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn lint && yarn format && yarn build
      - run: node --test tests/widgetApi.test.mjs
      - run: git diff -- src
