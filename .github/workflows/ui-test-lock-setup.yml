name: Prepare formatted UI test files

on:
  push:
    branches:
      - ui-test-lock-setup

jobs:
  formatting:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devbranch
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: ./node_modules/.bin/prettier --write tests/widgetContext.test.mjs tests/widgetItem.test.mjs tests/widgetSpecificParams.test.mjs tests/widgetUiHarness.mjs
      - name: Capture formatted files
        run: |
          for file in tests/widgetContext.test.mjs tests/widgetItem.test.mjs tests/widgetSpecificParams.test.mjs tests/widgetUiHarness.mjs; do
            echo "FILE_START:$file"
            base64 -w 1024 "$file"
            echo "FILE_END:$file"
          done
          git diff --stat
